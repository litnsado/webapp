<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ROOTS emblem">
  <defs>
    <radialGradient id="sky" cx="50%" cy="34%" r="76%">
      <stop offset="0%"   stop-color="#1B2A5E"/>
      <stop offset="55%"  stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
