<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin — ROOTS</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0B1020">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/assets/logo/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body class="page page--admin">

  <section class="admin-login" id="loginView">
    <div class="admin-login__inner">
      <img class="admin-login__logo" src="/assets/logo/logo.svg" alt="" width="88" height="88">
      <h1 class="admin-login__title">ROOTS Admin</h1>
      <p class="admin-login__sub">Sign in to manage the batch.</p>

      <form class="form" id="loginForm" novalidate>
        <label class="field">
          <span class="field__label">Email</span>
          <input class="field__input field__input--plain" type="email"
                 name="email" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="field__label">Password</span>
          <input class="field__input field__input--plain" type="password"
                 name="password" autocomplete="current-password" required>
        </label>
        <span class="field__error" id="loginError" hidden></span>
        <button class="btn btn--primary btn--block" type="submit" id="loginBtn">
          Sign in
        </button>
      </form>

      <p class="admin-login__foot">
        Not an admin? <a href="/index.html">Go home</a>
      </p>
    </div>
  </section>

  <section class="admin" id="adminView" hidden>

    <header class="admin__head">
      <div>
        <h1 class="page__title">Admin</h1>
        <p class="page__meta" id="adminMeta">Loading…</p>
      </div>
      <div class="admin__head-actions">
        <button class="icon-btn" type="button" id="exportBtn" aria-label="Export CSV">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 4v11m0 0 4-4m-4 4-4-4" stroke="currentColor"
                  stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 17v2.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V17"
                  stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" type="button" id="logoutBtn" aria-label="Sign out">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 12H4m0 0 3.5-3.5M4 12l3.5 3.5" stroke="currentColor"
                  stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M11 6V5a1.5 1.5 0 0 1 1.5-1.5h6A1.5 1.5 0 0 1 20 5v14a1.5 1.5 0 0 1-1.5 1.5h-6A1.5 1.5 0 0 1 11 19v-1"
                  stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab is-active" role="tab" data-tab="pending" aria-selected="true">
        Pending <span class="tab__count" id="pendingCount">0</span>
      </button>
      <button class="tab" role="tab" data-tab="approved" aria-selected="false">Approved</button>
      <button class="tab" role="tab" data-tab="memories" aria-selected="false">
        Memories <span class="tab__count" id="memCount">0</span>
      </button>
      <button class="tab" role="tab" data-tab="birthdays" aria-selected="false">Birthdays</button>
    </nav>

    <main class="admin__body">
      <div class="admin__panel" id="panelPending"   data-panel="pending"></div>
      <div class="admin__panel" id="panelApproved"  data-panel="approved"  hidden></div>
      <div class="admin__panel" id="panelMemories"  data-panel="memories"  hidden></div>
      <div class="admin__panel" id="panelBirthdays" data-panel="birthdays" hidden></div>
    </main>
  </section>

  <div class="sheet-scrim" data-sheet-scrim hidden></div>
  <aside class="sheet" id="sheet-edit" role="dialog" aria-modal="true" hidden>
    <div class="glass sheet__panel">
      <div class="sheet__handle" aria-hidden="true"></div>
      <h2 class="sheet__title">Edit profile</h2>
      <form class="form" id="editForm" novalidate></form>
      <div class="sheet__actions">
        <button class="btn btn--ghost btn--block" type="button" data-close-sheet>Cancel</button>
        <button class="btn btn--primary btn--block" type="submit" form="editForm">Save</button>
      </div>
    </div>
  </aside>

  <script src="/js/supabase.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/admin.js" defer></script>
</body>
</html>
